name: VSound
options:
  # Keep existing sandbox identifiers so installed libraries and folder permissions survive the rename.
  bundleIdPrefix: app.localmusic
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MusicCore:
    type: framework.static
    platform: macOS
    sources: [Sources/MusicCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.localmusic.core
        GENERATE_INFOPLIST_FILE: YES
  VSound:
    type: application
    platform: macOS
    sources:
      - Sources/VSound
      - Resources/Assets.xcassets
    dependencies:
      - target: MusicCore
        embed: false
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 维音
        CFBundleName: 维音
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: Copyright © 2026 VSound
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        VSoundGoogleClientID: $(VSOUND_GOOGLE_CLIENT_ID)
        VSoundDropboxAppKey: $(VSOUND_DROPBOX_APP_KEY)
    entitlements:
      path: Resources/VSound.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.localmusic.player
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  VSound:
    build:
      targets:
        VSound: all
    run:
      config: Debug
